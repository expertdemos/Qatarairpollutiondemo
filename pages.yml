name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check
        run: |
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          SIZE=$(wc -c < index.html); echo "index.html ${SIZE} bytes"
          [ "$SIZE" -ge 60000 ] || { echo "::error::index.html truncated"; exit 1; }
          grep -q "Art of the Possible" index.html || { echo "::error::banner missing"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
