<style>

.tag-vunh{color:#6d2f8f;background:#F3E9F8;border-color:#E3CDEF}.tag-dust{color:#8a5212;background:#FBEEDC;border-color:#EFD6B0}
.tag-asm{color:#8a5212;background:#FDF0E0;border-color:#F7D8B4}

.alertrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.alertrow:last-child{border-bottom:none}

.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--ink-3);margin-top:8px}

/* how this page works */
.how{margin-top:26px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}

 display:flex;align-items:center;gap:9px;background:var(--surface-2);letter-spacing:.03em}

/* ===================== WIND =====================
   Two opposing effects, both ASSUMED relationships.
   1. Wind blows pollution away    -> reduces everything
   2. Strong wind lifts loose sand -> increases dust only */
const WIND={ref:14, dispPerKmh:0.022, dispFloor:0.55,
 liftStart:18, liftDiv:30, liftMax:0.55};
function dustLift(speed){
 const s=(speed==null)?state.weather.windSpeed:speed;
 return 1+Math.min(WIND.liftMax,Math.max(0,(s-WIND.liftStart)/WIND.liftDiv));}
function dispersion(speed){
 const s=(speed==null)?state.weather.windSpeed:speed;
 return Math.max(WIND.dispFloor,1+(s-WIND.ref)*WIND.dispPerKmh);}
function windWords(s){

function srcValues(st,pol,hour,scen){
 const rel=POL_REL[pol],w=SRC_POL[pol]||SRC_POL.pm25;
 const spd=(scen&&scen.windSpeed!=null)?scen.windSpeed:state.weather.windSpeed;
 const lift=dustLift(spd);
 const out={};let tot=0;
 SOURCES.forEach(function(s){
  let v=st.base*(st.mix[s.k]||0)*rel*(w[s.k]||0);
  const kind=(s.k==='traffic')?'traffic':(s.k==='dust'||s.k==='constr')?'dust':'flat';
  v*=diu(kind,hour);
  if(s.k==='dust')  v*=lift;
  if(s.k==='constr')v*=1+(lift-1)*0.5;
  if(scen){
   if(s.k==='traffic') v*=(1-(scen.traffic||0)/100)*(1-0.40*(scen.fleet||0)/100);
   if(s.k==='industry')v*=(1-(scen.industry||0)/100);
   if(s.k==='constr')  v*=(1-(scen.constr||0)/100);
   if(s.k==='power')   v*=(1-(scen.power||0)/100);
   if(s.k==='marine')  v*=(1-(scen.marine||0)/100);
   if(s.k==='dust')    v*=(1-0.18*(scen.greening||0)/100);
   if(s.k==='dust'&&scen.dustEvent) v*=(1+(scen.dustEvent/100)*(pol==='pm10'?3.4:pol==='pm25'?1.5:0.05));
  }
  out[s.k]=v; tot+=v;});
 out._total=tot; return out;}
function nodesFrom(list,scen,hourOverride){

  if(modeIs('public')){
   const v=(st.live&&st.live[pol]!=null)?st.live[pol]:null;
   return{st,value:v==null?0:v,src:null,prov:'measured',noData:v==null};}
  const sv=srcValues(st,pol,hr,scen);
  let value=sv._total,prov='derived';
  if(live&&st.live&&st.live[pol]!=null){
   const base=srcValues(st,pol,hr,null)._total,liveV=st.live[pol];
   value=scen?(liveV*(base>0?sv._total/base:1)):liveV;
   const k=base>0?liveV/base:1;
   SOURCES.forEach(s=>{sv[s.k]*=k;});sv._total=value;prov='blend';}
  return{st,value,src:sv,prov,noData:false};});}

function windVec(scen){
 const dir=(scen&&scen.windDir!=null)?scen.windDir:state.weather.windDir;
 const spd=(scen&&scen.windSpeed!=null)?scen.windSpeed:state.weather.windSpeed;
 const tw=(dir+180)*Math.PI/180,mag=Math.min(.02,(spd||0)*.0009);

function idwAt(lat,lon,nodes,scen){
 const use=nodes.filter(n=>!n.noData);if(!use.length)return 0;
 const wv=windVec(scen),disp=dispersion(wv.spd);let n=0,d=0;
 for(let i=0;i<use.length;i++){const x=use[i];
  const dy=(lat-(x.st.lat+wv.dLat))*111,dx=(lon-(x.st.lon+wv.dLon))*100;
  let d2=dx*dx+dy*dy;if(d2<0.6)d2=0.6;
  const w=1/Math.pow(d2,1.25);n+=w*x.value;d+=w;}

function sampleAt(lat,lon,nodes,scen){return idwAt(lat,lon,nodes,scen);}

const MAPS={};
function bounds(){
 const c=CITY_BY_K[state.cityKey]||CITIES[0];
 const p=activeStations().concat(activeReceptors());
 if(p.length<2)return[[c.lat-.12,c.lon-.14],[c.lat+.12,c.lon+.14]];
 let a=Infinity,b=-Infinity,c2=Infinity,d=-Infinity;
 p.forEach(x=>{a=Math.min(a,x.lat);b=Math.max(b,x.lat);c2=Math.min(c2,x.lon);d=Math.max(d,x.lon);});
 const padLat=Math.max(.03,(b-a)*.20),padLon=Math.max(.04,(d-c2)*.20);
 return[[a-padLat,c2-padLon],[b+padLat,d+padLon]];}
function surfaceLayer(o){
 const S=L.Layer.extend({
  onAdd:function(m){this._c=L.DomUtil.create('canvas','');this._c.style.pointerEvents='none';
   m.getPane('surf').appendChild(this._c);m.on('moveend zoomend resize',this._r,this);this._r();},
  onRemove:function(m){L.DomUtil.remove(this._c);m.off('moveend zoomend resize',this._r,this);},
  _r:function(){if(!this._c)return;const m=this._map,s=m.getSize();
   this._c.width=s.x;this._c.height=s.y;
   L.DomUtil.setPosition(this._c,m.containerPointToLayerPoint([0,0]));this.draw();},
  draw:function(){if(!this._c||!this._map)return;
   const ctx=this._c.getContext('2d'),m=this._map,sz=m.getSize();
   ctx.clearRect(0,0,sz.x,sz.y);if(!state.showSurface)return;
   const scen=o.scope==='scen'?state.scenario:null;
   const hr=(o.scope==='time')?(state.hour+state.tOffset):null;
   const nodes=nodeValues(scen,hr).filter(n=>!n.noData);if(!nodes.length)return;
   const b=m.getBounds(),cb=bounds();
   const s=Math.max(b.getSouth(),cb[0][0]-.08),n=Math.min(b.getNorth(),cb[1][0]+.08);
   const w=Math.max(b.getWest(),cb[0][1]-.08),e=Math.min(b.getEast(),cb[1][1]+.08);
   if(n<=s||e<=w)return;
   const N=(o.scope==='main'||o.scope==='time')?44:28,dLa=(n-s)/N,dLo=(e-w)/N;
   const tl=m.latLngToContainerPoint([n,w]),br=m.latLngToContainerPoint([s,e]);
   const cw=Math.abs(br.x-tl.x)/N+1.5,ch=Math.abs(br.y-tl.y)/N+1.5;
   ctx.save();try{ctx.filter='blur(15px)';}catch(err){}
   const BA=[.16,.40,.66,.85,1,1];
   for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const la=s+(i+.5)*dLa,lo=w+(j+.5)*dLo;
    const bd=bandFor(state.pollutant,idwAt(la,lo,nodes,scen));
    ctx.globalAlpha=state.surfaceOpacity*BA[bd.idx];
    const p=m.latLngToContainerPoint([la,lo]);
    ctx.fillStyle=bd.hex;ctx.fillRect(p.x-cw/2,p.y-ch/2,cw,ch);}
   ctx.restore();}});
 return new S();}

 const m=L.map(div,{zoomControl:big,attributionControl:true,preferCanvas:true,scrollWheelZoom:big,minZoom:7,maxZoom:16});
 m.createPane('surf').style.zIndex=400;m.getPane('surf').style.pointerEvents='none';
 m.createPane('zon').style.zIndex=430;m.createPane('pts').style.zIndex=470;

  pts:L.layerGroup().addTo(m),rec:L.layerGroup().addTo(m),zone:L.layerGroup().addTo(m)};

function setBase(o,k){const c=BASEMAPS[k]||BASEMAPS.voyager;

function settle(o,t){
 const w=o.div.clientWidth||o.div.offsetWidth,h=o.div.clientHeight||o.div.offsetHeight;
 if((w<40||h<40)&&t<40){requestAnimationFrame(()=>settle(o,t+1));return;}

 if(!o.fitted&&w>40&&h>40){try{o.map.fitBounds(bounds(),{padding:[14,14],animate:false});o.fitted=true;}
  catch(e){const c=CITY_BY_K[state.cityKey]||CITIES[0];o.map.setView([c.lat,c.lon],c.z);o.fitted=true;}}

 {id:"dust",n:"Dust Storms",ic:"dust",g:"Predict"},
 {id:"whatif",n:"What If",ic:"beaker",g:"Test"},
 {id:"compare",n:"Compare Options",ic:"scales",g:"Test"},
 {id:"nested",n:"Zoom Levels",ic:"layers",g:"Test"},
 {id:"alerts",n:"Alerts",ic:"bell",g:"Act"},
 {id:"kpi",n:"Measuring Success",ic:"gauge",g:"Act"},
 {id:"brief",n:"Decision Brief",ic:"file",g:"Act"},
 {id:"register",n:"Data & Method",ic:"database",g:"Act"}];
const CHAIN=[["See","What the air is doing now"],["Understand","What causes it, who it affects"],
 ["Predict","What happens next"],["Test","Try changes before making them"],["Act","Decide, and show why"]];
const NEEDS_STRUCTURE={attrib:'Finding the cause',exposure:'Who breathes it',compare:'Comparing options',
 whatif:'Testing changes',dust:'Dust storm modelling',kpi:'Exposure measures'};
function render(){
 const app=document.getElementById('app');
 if(state.screen==="loading"){app.innerHTML=vLoading();wire();return;}
 let nav='',last=null;
 SCREENS.forEach(function(s){
  if(s.g!==last){nav+='<div class="navgrp"><span class="dot"></span>'+s.g+'</div>';last=s.g;}
  const dim=(!usesStructure()&&NEEDS_STRUCTURE[s.id]);
  nav+='<button class="nav-item'+(state.screen===s.id?' active':'')+'" data-act="nav" data-s="'+s.id+'"'
   +(dim?' style="opacity:.45" title="Needs assumptions on top of public data"':'')+'>'+icon(s.ic)+'<span>'+s.n+'</span></button>';});
 app.innerHTML=''
  +'<aside class="sidebar no-print"><div class="brand"><div class="mark">'+LOGO
  +'<div><div class="name">Qatar Air Quality<br>Digital Twin</div><div class="sub">See \u00b7 Understand \u00b7 Act</div></div></div></div>'
  +'<nav class="nav">'+nav+'</nav>'+sideCard()+'</aside>'
  +'<div class="main-wrap"><header class="topbar no-print">'
  +'<div class="selwrap">'+icon('pin')+'<label>City</label><select data-act="city">'
  +CITIES.map(c=>'<option value="'+c.k+'"'+(state.cityKey===c.k?' selected':'')+'>'+c.n+'</option>').join('')
  +'</select></div>'
  +'<div class="modesw" title="Which data the demo is using">'
  +MODES.map(m=>'<button class="'+(state.mode===m.k?'on':'')+'" data-act="mode" data-m="'+m.k+'" title="'+esc(m.d)+'">'+icon(m.ic)+m.sh+'</button>').join('')
  +'</div>'
  +badge()+'<div class="spacer"></div>'
  +'<div class="polsel">'+Object.values(POLLUTANTS).map(p=>'<button class="'+(state.pollutant===p.id?'on':'')+'" data-act="pol" data-p="'+p.id+'" title="'+esc(p.name)+'">'+p.label+'</button>').join('')+'</div>'
  +'<button class="btn sm" data-act="refresh">'+icon('refresh')+'Refresh</button></header>'
  +'<main class="main">'+body()+'</main></div>';
 wire();mountMaps();}
function badge(){
 if(modeIs('sample'))return '<span class="pill tag-demo">'+icon('flask')+'All assumptions</span>';
 if(!state.liveOK)return '<span class="pill tag-demo">'+icon('alert')+'Live feed unavailable</span>';
 const t=state.live?new Date(state.live.fetchedAt):new Date();
 return '<span class="pill '+(modeIs('public')?'tag-live':'tag-blend')+'">\u25CF Live \u00b7 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+'</span>';}
function sideCard(){const n=nodeValues(null);
 const use=n.filter(x=>!x.noData);
 if(!use.length)return '<div class="sidecard"><div class="muted">No data for this city.</div></div>';
 const a=popAvg(n),b=bandFor(state.pollutant,a),e=exposed(n,state.pollutant,3);
 const t=srcTotals(null),lead=t?leadSource(t):null,c=CITY_BY_K[state.cityKey];
 return '<div class="sidecard"><div style="font-weight:700;font-size:13px">'+cityLabel()+'</div>'
 +'<div class="muted" style="font-size:10.5px;margin-bottom:6px">'+c.sub+'</div>'
 +'<div class="row"><span>Using</span><b>'+MODE_BY_K[state.mode].sh+' data</b></div>'
 +'<div class="row"><span>Showing</span><b>'+POLLUTANTS[state.pollutant].label+'</b></div>'
 +'<div class="row"><span>Average now</span><b>'+a.toFixed(0)+' '+POLLUTANTS[state.pollutant].unit+'</b></div>'
 +'<div class="row"><span>Level</span><b style="color:'+b.hex+'">'+b.name+'</b></div>'
 +(lead?'<div class="row"><span>Mostly from<sup style="color:var(--dust)">A</sup></span><b style="color:'+SRC_BY_K[lead.k].c+'">'+SRC_BY_K[lead.k].n+'</b></div>':'')
 +(e?'<div class="row"><span>People affected<sup style="color:var(--dust)">A</sup></span><b>'+e.pct+'%</b></div>':'')
 +'<div class="row"><span>Wind</span><b>'+compass(state.weather.windDir)+' '+state.weather.windSpeed+' km/h</b></div>'
 +'<div class="row"><span>Places</span><b>'+use.length+'</b></div>'
 +(usesStructure()&&hasLevers()?'<div class="row"><span>Test running</span><b>'+(state.preset&&PRESETS[state.preset]?PRESETS[state.preset].label:'Custom')+'</b></div>':'')
 +(usesStructure()?'<div class="row" style="border-top:1px solid var(--line);margin-top:4px;padding-top:5px"><span style="font-size:10px"><sup style="color:var(--dust)">A</sup> = assumption</span><b></b></div>':'')
 +'</div>';}
function hasLevers(){const s=state.scenario;return !!(s.traffic||s.fleet||s.industry||s.constr||s.power||s.marine||s.greening);}
function body(){
 const use=nodeValues(null).filter(x=>!x.noData);
 if(!use.length)return '<div class="card pad" style="margin-top:40px;text-align:center">'
  +'<h2 style="font-size:18px;margin-bottom:6px">No data for '+cityLabel()+'</h2>'
  +'<p class="muted" style="font-size:13.5px">'+(modeIs('public')?'The live feed returned nothing here. Try Sample data or Blended.':'Pick another city.')+'</p></div>';
 if(!usesStructure()&&NEEDS_STRUCTURE[state.screen])
  return head(NEEDS_STRUCTURE[state.screen],'This needs assumptions on top of free public data.')+needsStructure(NEEDS_STRUCTURE[state.screen]);
 switch(state.screen){
 case"home":return vHome();case"live":return vLive();case"time":return vTime();
 case"attrib":return vAttrib();case"hotspot":return vHotspot();case"exposure":return vExposure();
 case"forecast":return vForecast();case"dust":return vDust();
 case"whatif":return vWhatIf();case"compare":return vCompare();case"nested":return vNested();
 case"alerts":return vAlerts();case"kpi":return vKPI();case"brief":return vBrief();
 case"register":return vRegister();
 default:return vHome();}}
function head(t,s){const cur=SCREENS.find(x=>x.id===state.screen);
 return '<div class="chain">'+CHAIN.map(c=>'<div class="st'+(c[0]===cur.g?' on':'')+'"><div class="cn">'+c[0]+'</div><div class="cd">'+c[1]+'</div></div>').join('')+'</div>'
  +'<div class="eyebrow">'+cur.n+' \u00b7 '+esc(cityLabel())+'</div>'
  +'<h1 class="h-page">'+t+'</h1><p class="sub" style="margin-bottom:20px">'+s+'</p>';}
function kpi(k,v,m,c){return '<div class="kpi"><div class="k">'+k+'</div><div class="v" style="'+(c?'color:'+c:'')+'">'+v+'</div><div class="m">'+m+'</div></div>';}
function ins(ic,t,b,bg,c){return{ic,t,b,bg:bg||"#FBEFF2",col:c||"var(--maroon-d)"};}
function insList(a){return a.filter(Boolean).map(o=>'<div class="insightbox"><div class="ib-ic" style="background:'+o.bg+';color:'+o.col+'">'+icon(o.ic)+'</div><div><div class="ib-t">'+o.t+'</div><div class="ib-b">'+o.b+'</div></div></div>').join('');}
function vLoading(){return '<div class="main"><div class="loadwrap">'+LOGO+'<div class="spinner" style="margin-top:24px"></div>'
 +'<h2 style="font-size:20px">Starting up</h2>'
 +'<p class="muted" style="font-size:13.5px">'+QATAR.flag+' Qatar \u00b7 '+CITIES.length+' cities \u00b7 '+QATAR.stations.length+' places</p>'
 +'<div class="loadsteps"><div>'+icon('check')+' Loading places</div>'
 +'<div>'+icon('refresh')+' Fetching readings from Copernicus via Open-Meteo</div>'
 +'<div>'+icon('layers')+' Applying assumptions and drawing the map</div></div></div></div>';}
function modeBanner(){
 if(modeIs('public'))return '<div class="callout warn" style="margin-bottom:16px">'+icon('sat')
  +' <b>Public data only \u2014 no assumptions applied.</b> These are real readings, but free services only publish how much pollution there is. Pages that need assumptions are switched off.</div>';
 if(modeIs('sample'))return '<div class="callout" style="margin-bottom:16px">'+icon('flask')
  +' <b>Sample data \u2014 every number is an assumption.</b> Everything works, but none of it is a real measurement.</div>';
 if(!state.liveOK)return '<div class="callout warn" style="margin-bottom:16px">'+icon('alert')
  +' <b>Live feed unavailable.</b> Falling back to assumptions until it returns.</div>';
 return '<div class="callout info" style="margin-bottom:16px">'+icon('merge')
  +' <b>Blended.</b> The totals are real readings '+pv('measured')+'. The breakdown is based on assumptions '+pv('derived')+'.</div>';}

/* ===================== MAP HELPERS ===================== */
function mapBlock(scope,ctl){
 if(!MAP_OK)return '<div class="mapwrap"><div style="padding:34px;color:#7d4a10;font-size:13px;line-height:1.7">'
  +icon('alert')+' <b>The map service is blocked on this network.</b><br>Every other page still works.</div></div>';
 return '<div class="mapwrap">'+(ctl!==false?'<div class="mapctl">'
  +'<button class="mapchip'+(state.showSurface?' on':'')+'" data-act="tog" data-t="showSurface">Pollution shading</button>'
  +'<button class="mapchip'+(state.showStations?' on':'')+'" data-act="tog" data-t="showStations">Places</button>'
  +(usesStructure()?'<button class="mapchip'+(state.showReceptors?' on':'')+'" data-act="tog" data-t="showReceptors">Schools &amp; hospitals</button>':'')
  +'</div>':'')+'<div data-leaf="'+scope+'"></div></div>';}
function mapLegend(){return '<div class="maplegend">'+BAND_NAMES.map((n,i)=>'<span><i style="background:'+RAMP[i]+'"></i>'+n+'</span>').join('')
 +(usesStructure()?'<span style="margin-left:auto">'+icon('school')+' school/hospital</span>':'')+'</div>';}
function basePicker(){return '<div class="card pad" style="margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
 +'<label style="font-size:12.5px;font-weight:600;color:var(--ink-2)">'+icon('layers')+' Map style</label>'
 +'<select class="inp" data-act="base" style="max-width:190px">'+Object.keys(BASEMAPS).map(k=>'<option value="'+k+'"'+(state.basemap===k?' selected':'')+'>'+BASEMAPS[k].n+'</option>').join('')+'</select>'
 +'<label style="font-size:12.5px;font-weight:600;color:var(--ink-2)">Shading strength</label>'
 +'<input type="range" min="0" max="60" value="'+Math.round(state.surfaceOpacity*100)+'" data-act="haze" style="width:120px;accent-color:var(--maroon)"/>'
 +'<span class="muted" style="font-size:11.5px;min-width:32px" id="hz">'+Math.round(state.surfaceOpacity*100)+'%</span>'
 +'<span class="muted" style="font-size:11px;flex:1;min-width:200px">Street maps from OpenStreetMap; satellite from Esri. No cadastral or parcel data.</span></div>';}
function wxStrip(){const w=state.weather,lift=dustLift(w.windSpeed),disp=dispersion(w.windSpeed);
 return '<div class="card pad" style="margin-top:14px">'
  +'<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">'
  +'<span style="font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase">'+icon('wind')+' Weather'+(state.liveOK?pv('measured'):'')+'</span>'
  +'<span style="font-size:13px"><b>'+compass(w.windDir)+'</b> <span class="muted">wind from</span></span>'
  +'<span style="font-size:13px"><b>'+w.windSpeed+' km/h</b> <span class="muted">'+windWords(w.windSpeed)+'</span></span>'
  +'<span style="font-size:13px"><b>'+w.temp+'\u00B0C</b></span><span style="font-size:13px"><b>'+w.humidity+'%</b> <span class="muted">humidity</span></span></div>'
  +'<div class="muted" style="font-size:11.5px;margin-top:9px;line-height:1.6">'
  +'<b>Assumed wind effect.</b> Wind blows pollution away, so higher wind means lower readings \u2014 currently thinning everything by about <b>'
  +Math.round(Math.abs(1-1/disp)*100)+'%</b>. '
  +(lift>1.001?('Above about 18 km/h it also lifts loose sand, assumed to add roughly <b>'
   +Math.round((lift-1)*100)+'%</b> back onto the dust. On a windy day the gases clear while the dust does not.')
   :'Below about 18 km/h it is assumed not to lift much loose material, so nothing is added back.')
  +'</div></div>';}
function srcBar(src,h){if(!src)return'';const tot=src._total||1;
 return '<div class="srcbar" style="'+(h?'height:'+h+'px':'')+'">'+SOURCES.map(s=>{
  const p=(src[s.k]||0)/tot*100;
  return p<0.6?'':'<div title="'+s.n+' '+p.toFixed(0)+'% (assumption)" style="width:'+p+'%;background:'+s.c+'"></div>';}).join('')+'</div>';}
function srcLegend(src){if(!src)return'';const tot=src._total||1;
 return '<div class="legend" style="justify-content:flex-start;margin-top:10px">'+SOURCES.map(s=>
  '<span>'+icon(s.ic)+' <i style="background:'+s.c+'"></i>'+s.n+' \u2014 <b>'+Math.round((src[s.k]||0))+'</b> ('+Math.round((src[s.k]||0)/tot*100)+'%)</span>').join('')+'</div>';}

/* ===================== OVERVIEW ===================== */

 const all=nodesFrom(state.city.stations,null,null);
 const nodes=nodeValues(null).filter(n=>!n.noData).sort((a,b)=>b.value-a.value);
 const a=popAvg(nodes),b=bandFor(state.pollutant,a),p=POLLUTANTS[state.pollutant];
 const t=srcTotals(null),lead=t?leadSource(t):null,e=exposed(nodes,state.pollutant,3);
 const stats=cityStats().sort((x,y)=>y.avg-x.avg);
 return '<div class="eyebrow">Overview \u00b7 '+esc(cityLabel())+'</div>'
  +'<h1 class="h-page">Qatar\u2019s air, city by city</h1>'
  +'<p class="sub" style="margin-bottom:16px">Pick a city on the map or from the list.</p>'
  +'<div class="homewrap">'+qPlan(all)
  +'<div class="home-hud"><div class="hud-card"><div class="ht"><span class="livedot"></span>'+cityLabel()+'</div>'
  +'<h2>Air Quality Digital Twin</h2><div class="hs">'+nodes.length+' places \u00b7 '+MODE_BY_K[state.mode].n+'</div>'
  +'<div class="hud-val"><span class="n" style="color:'+b.hex+'">'+a.toFixed(0)+'</span><span class="u">'+p.unit+' '+p.label+'<br>'+b.name+'</span></div>'
  +'<div class="sweepbar" style="margin-top:10px"></div></div>'
  +(lead?'<div class="hud-card"><div class="ht">Mostly from '+asmTag()+'</div>'
   +'<div style="display:flex;align-items:center;gap:9px;margin:7px 0 6px">'
   +'<span style="width:30px;height:30px;border-radius:8px;background:'+SRC_BY_K[lead.k].c+';color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 30px">'+icon(SRC_BY_K[lead.k].ic)+'</span>'
   +'<div><div style="font-size:14.5px;font-weight:700">'+SRC_BY_K[lead.k].n+'</div>'
   +'<div class="muted" style="font-size:11.5px">'+Math.round(lead.share*100)+'% of it</div></div></div>'
   +srcBar(t,14)
   +'<div class="muted" style="font-size:11px;margin-top:7px;line-height:1.5">Natural desert dust assumed at <b>'+Math.round((t.dust/t._total)*100)+'%</b> \u2014 nothing local removes that part.</div></div>'
   :'<div class="hud-card"><div class="ht">What is it made of?</div>'
   +'<div style="font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:6px">Free public data cannot tell you. Answering it needs assumptions \u2014 switch to Sample or Blended above.</div></div>')
  +'<div class="hud-card"><div class="hud-row"><span>Worst place</span><b>'+nodes[0].st.name+'</b></div>'
  +'<div class="hud-row"><span></span><b style="color:'+bandFor(state.pollutant,nodes[0].value).hex+'">'+Math.round(nodes[0].value)+' '+p.unit+'</b></div>'
  +(e?'<div class="hud-row" style="border-top:1px solid var(--line);margin-top:5px;padding-top:7px"><span>People affected '+asmTag()+'</span><b>'+e.pct+'%</b></div>':'')
  +'<div class="hud-row"><span>Wind</span><b>'+compass(state.weather.windDir)+' \u00b7 '+state.weather.windSpeed+' km/h</b></div></div></div>'
  +'<div class="home-stats">'
  +'<div class="hud-card" style="padding:9px 12px"><div class="ht">Compare cities \u00b7 '+p.label+'</div>'
  +'<div class="muted" style="font-size:10.5px;margin-top:2px">Click to switch</div></div>'
  +stats.map(function(s){const bb=bandFor(state.pollutant,s.avg);
   return '<div class="crow'+(s.c.k===state.cityKey?' on':'')+'" data-act="city" data-v="'+s.c.k+'">'
    +'<span class="cdot" style="background:'+bb.hex+'"></span>'
    +'<span class="cn">'+s.c.n+(s.lead?'<span class="cs" style="color:'+SRC_BY_K[s.lead.k].c+'">'+SRC_BY_K[s.lead.k].n+'</span>':'<span class="cs muted">'+s.n+' places</span>')+'</span>'
    +'<b style="font-size:12.5px;color:'+bb.hex+';font-variant-numeric:tabular-nums">'+Math.round(s.avg)+'</b></div>';}).join('')+'</div>'
  +'<div class="home-legend"><div style="font-weight:700;margin-bottom:3px">'+p.label+' levels</div>'
  +BAND_NAMES.map((n,i)=>'<div><i style="background:'+RAMP[i]+'"></i>'+n+'</div>').join('')+'</div>'

  +'<button class="mapchip" data-act="nav" data-s="live">Open the map '+icon('arrowr')+'</button></div></div>'
  +homeExplain();}

/* ===================== LIVE MAP ===================== */
function vLive(){
 const nodes=nodeValues(null).filter(n=>!n.noData).sort((a,b)=>b.value-a.value);
 const a=popAvg(nodes),b=bandFor(state.pollutant,a),p=POLLUTANTS[state.pollutant];
 const e=exposed(nodes,state.pollutant,3),t=srcTotals(null),lead=t?leadSource(t):null;
 return head("Air quality across "+cityLabel(),
  "Readings at each place, with the gaps between them filled in by estimate.")
  +modeBanner()
  +(state.dustActive?'<div class="callout dust" style="margin-bottom:16px">'+icon('dust')+' <b>Dust is high right now.</b> Most particles in the air are desert dust rather than pollution from traffic or industry.</div>':'')
  +'<div class="maplayout"><div><div class="card" style="padding:14px">'
  +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">'
  +'<span style="font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center"><span class="livedot"></span>'
  +nodes.length+' places</span>'
  +(lead?'<span class="muted" style="font-size:11.5px">Mostly <b style="color:'+SRC_BY_K[lead.k].c+'">'+SRC_BY_K[lead.k].n.toLowerCase()+'</b> '+asmTag()+'</span>':'')
  +'<span class="sweepbar" style="flex:1;min-width:90px"></span></div>'
  +mapBlock('main',true)+mapLegend()+'</div>'+basePicker()+wxStrip()+'</div>'
  +'<div class="card pad"><h3 style="margin-bottom:4px">Places, worst first</h3>'
  +'<div class="muted" style="font-size:12px;margin-bottom:8px">'+(usesStructure()?'The colour bar shows the assumed mix of causes':'Level only')+'</div>'
  +'<div class="stationside">'+nodes.map(function(n){const bb=bandFor(state.pollutant,n.value);
   const ls=n.src?leadSource(n.src):null;
   return '<div class="srow" data-act="pick" data-s="'+n.st.id+'"><div class="sswatch" style="background:'+bb.hex+'">'+Math.round(n.value)+'</div>'
    +'<div style="min-width:0;flex:1"><div class="sn">'+n.st.name+(n.st.ref&&usesStructure()?' <span style="color:var(--maroon);font-size:9px;font-weight:800">REF</span>':'')+'</div>'
    +(n.src?'<div style="margin-top:3px">'+srcBar(n.src,6)+'</div>'
      +'<div class="sm" style="margin-top:3px;color:'+SRC_BY_K[ls.k].c+';font-weight:600">'+SRC_BY_K[ls.k].n+' '+Math.round(ls.share*100)+'%</div>'
      :'<div class="sm">'+n.st.area+'</div>')+'</div></div>';}).join('')+'</div></div></div>'
  +'<div class="kpis" style="margin-top:18px">'
  +kpi("Average now",a.toFixed(0)+' '+p.unit,b.name+' \u00b7 '+avgLabel(),b.hex)
  +kpi("Worst place",Math.round(nodes[0].value)+' '+p.unit,nodes[0].st.name,bandFor(state.pollutant,nodes[0].value).hex)
  +(t?kpi("Natural dust",Math.round(t.dust/t._total*100)+'%','assumed share of the air',"var(--dust)")
    :kpi("Natural dust",'\u2014','needs assumptions',"var(--ink-3)"))
  +(e?kpi("People affected",e.pct+'%','assumed population',"var(--red)")
    :kpi("People affected",'\u2014','needs assumptions',"var(--ink-3)"))+'</div>'
  +how([
   ['Readings arrive for each place',modeLine()+' Data comes from the Copernicus Atmosphere Monitoring Service, updated four times a day.'],
   ['The gaps are filled in','Nobody measures every street. Between the dots the map estimates, weighting nearby places more heavily than distant ones.'],
   ['Wind shifts and thins the picture','The pattern is nudged downwind. Higher wind lowers readings \u2014 except dust, which strong wind lifts more of.'],
   ['Colours show how bad it is','Green through to purple, on a scale chosen for Gulf conditions.'],
   ['The average counts people, not places',usesStructure()?'A busy district counts for more than empty desert.':'On public data there are no population figures, so this is a simple average.']])
  +assumptions(baseAssumptions().concat([
   ['Wind thins pollution at a fixed rate',
    'Every 1 km/h above 14 km/h reduces the estimate by about 2.2%, down to a floor. Below that, readings rise. The relationship is assumed, not measured.','14 km/h reference'],
   ['Strong wind lifts loose dust',

function chart(ser,off){
 const W=980,H=250,pl=44,pr=16,pt=16,pb=32;
 if(!ser.length)return'<p class="muted">Nothing to show.</p>';
 const vals=ser.map(s=>s.val),vmax=Math.max.apply(null,vals)*1.18||1;
 const x=i=>pl+(i/(ser.length-1))*(W-pl-pr),y=v=>H-pb-(v/vmax)*(H-pt-pb);
 let g='';
 for(let k=0;k<=4;k++){const vv=vmax*k/4,yy=y(vv);
  g+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="#F0E9E4"/>'
   +'<text x="'+(pl-6)+'" y="'+(yy+3)+'" font-size="9" fill="#7A6B72" text-anchor="end">'+Math.round(vv)+'</text>';}
 const bp=BP[state.pollutant];let bands='';
 for(let i=0;i<bp.length;i++){if(bp[i]>vmax)break;
  bands+='<line x1="'+pl+'" y1="'+y(bp[i])+'" x2="'+(W-pr)+'" y2="'+y(bp[i])+'" stroke="'+RAMP[i+1]+'" stroke-width="1" stroke-dasharray="4 5" opacity=".5"/>';}
 const rec=ser.filter(s=>!s.forecast),fc=ser.filter(s=>s.forecast),ni=rec.length-1;
 let cone='';
 if(fc.length&&ni>=0){const up=[],dn=[];
  fc.forEach(function(s,i){const u=uncertainty(s.val,s.k,0.4,liveActive());
   up.push(x(ni+1+i)+' '+y(u.hi).toFixed(1));dn.push(x(ni+1+i)+' '+y(u.lo).toFixed(1));});
  cone='<polygon points="'+up.join(' ')+' '+dn.reverse().join(' ')+'" fill="#1466E0" opacity=".12"/>';}
 const rp=rec.map((s,i)=>((i===0?'M':'L')+x(i)+' '+y(s.val).toFixed(1))).join(' ');
 const fp=(fc.length&&ni>=0)?('M'+x(ni)+' '+y(rec[ni].val).toFixed(1)+' '+fc.map((s,i)=>('L'+x(ni+1+i)+' '+y(s.val).toFixed(1))).join(' ')):'';
 let xl='';ser.forEach((s,i)=>{if(i%12===0)xl+='<text x="'+x(i)+'" y="'+(H-pb+15)+'" font-size="9" fill="#7A6B72" text-anchor="middle">'+String(s.h).padStart(2,'0')+'h</text>';});
 const nx=x(ni);let mk='';
 const idx=ser.findIndex(s=>s.k===off);
 if(idx>=0&&usesStructure()){const mx=x(idx),my=y(ser[idx].val);
  mk='<line x1="'+mx+'" y1="'+pt+'" x2="'+mx+'" y2="'+(H-pb)+'" stroke="#8A1538" stroke-width="1.5"/>'
   +'<circle cx="'+mx+'" cy="'+my+'" r="6" fill="#8A1538" stroke="#fff" stroke-width="2.5"/>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+bands+cone
  +'<line x1="'+nx+'" y1="'+pt+'" x2="'+nx+'" y2="'+(H-pb)+'" stroke="#DED4CF" stroke-dasharray="3 3"/>'
  +'<text x="'+nx+'" y="'+(H-pb+15)+'" font-size="9" font-weight="700" fill="#4A3D43" text-anchor="middle">now</text>'
  +'<path d="'+rp+'" fill="none" stroke="#8A1538" stroke-width="2.2"/>'
  +(fp?'<path d="'+fp+'" fill="none" stroke="#1466E0" stroke-width="2.2" stroke-dasharray="5 4"/>':'')+xl+mk+'</svg>'
  +'<div class="legend"><span><i style="background:#8A1538"></i>What happened</span><span><i style="background:#1466E0"></i>Forecast</span>'
  +'<span><i style="background:#1466E0;opacity:.25"></i>Assumed range</span></div>';}

  +(Math.abs(trend)<3?'Roughly steady.'
   :trend>0?'Assumed to <b>rise by about '+trend.toFixed(0)+'%</b>, as '+(lead.k==='dust'?'the afternoon wind picks up more dust':'evening traffic builds')+'.'
   :'Assumed to <b>drop by about '+Math.abs(trend).toFixed(0)+'%</b>.')+'</div></div>';}
function srcNote(k,sh){
 if(k==='dust')return sh>.6?'Assumed dominant \u2014 desert background, not reducible locally':sh>.35?'Assumed major':'Assumed present';
 if(k==='traffic')return sh>.40?'Assumed dominant \u2014 on or near a main road':sh>.25?'Assumed significant':'Assumed modest';
 if(k==='industry')return sh>.35?'Assumed dominant \u2014 close to heavy industry':sh>.15?'Assumed noticeable':'Assumed minor';
 if(k==='constr')return sh>.20?'Assumed raised \u2014 building work nearby':'Assumed normal for a built-up area';
 if(k==='power')return sh>.20?'Assumed noticeable \u2014 power or desalination nearby':'Assumed minor';
 return sh>.15?'Assumed noticeable \u2014 port or shipping nearby':'Assumed minor';}

function vExposure(){
 const p=POLLUTANTS[state.pollutant],nodes=nodeValues(null).filter(n=>!n.noData);
 const sc=state.scenario,sN=nodeValues(sc),has=hasLevers();
 const e=exposed(nodes,state.pollutant,3),eS=exposed(sN,state.pollutant,3);
 const pop=activeStations().reduce((a,s)=>a+(s.pop||0),0);
 const wavg=popAvg(nodes);
 const rec=activeReceptors().map(function(r){
  const v=sampleAt(r.lat,r.lon,nodes,null),v2=sampleAt(r.lat,r.lon,sN,sc);
  return{r,v,v2,b:bandFor(state.pollutant,v)};}).sort((a,b)=>b.v-a.v);
 const burden=nodes.map(n=>({n,load:n.value*(n.st.pop||0)})).sort((a,b)=>b.load-a.load);
 const totLoad=burden.reduce((a,x)=>a+x.load,0)||1;
 return head("Who is breathing it?",
  "A pollution map shows where the air is worst. This shows where the people are \u2014 and they are rarely the same places.")
  +modeBanner()
  +'<div class="callout warn" style="margin-bottom:18px">'+icon('alert')
  +' <b>All population figures on this page are assumptions.</b> They are realistic round numbers per area, not census data. '

  +'<div class="kpis" style="margin-bottom:18px">'
  +kpi("Average where people live",wavg.toFixed(1)+' '+p.unit,'assumed population weighting',bandFor(state.pollutant,wavg).hex)
  +kpi("People in affected areas",e.pct+'%',e.exposed.toLocaleString()+' of '+e.total.toLocaleString()+' (assumed)',"var(--red)")
  +kpi("People covered",(pop/1000).toFixed(0)+'k','assumed across '+nodes.length+' places',"var(--ink)")
  +kpi(has?"If the test were real":"No test running",has?(eS.pct+'%'):'\u2014',has?((e.exposed-eS.exposed).toLocaleString()+' fewer affected'):'set one up on the What If page',has?'var(--green)':'var(--ink-3)')+'</div>'
  +'<div class="section-head" style="margin-top:0"><h2>Where the greatest harm is '+asmTag()+'</h2>'
  +'<div class="d">Pollution level multiplied by the assumed number of people there</div></div>'
  +'<div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>#</th><th>Place</th><th>'+p.label+'</th><th>People '+asmTag()+'</th><th>Share of total harm</th><th>Mostly from</th></tr></thead><tbody>'
  +burden.map(function(x,i){const b=bandFor(state.pollutant,x.n.value),ls=leadSource(x.n.src);
   const sh=x.load/totLoad*100,rel=burden[0].load?x.load/burden[0].load*100:0;
   return '<tr><td><span class="rank" style="background:'+b.hex+'">'+(i+1)+'</span></td>'
    +'<td><b>'+x.n.st.name+'</b><div class="muted" style="font-size:11.5px">'+x.n.st.area+'</div></td>'
    +'<td style="font-weight:700;font-variant-numeric:tabular-nums">'+Math.round(x.n.value)+'</td>'
    +'<td class="muted" style="font-variant-numeric:tabular-nums">'+(x.n.st.pop||0).toLocaleString()+'</td>'
    +'<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;max-width:110px;height:8px;background:#F0E9E4;border-radius:4px"><div style="width:'+rel.toFixed(0)+'%;height:8px;background:var(--maroon);border-radius:4px"></div></div><b>'+sh.toFixed(1)+'%</b></div></td>'
    +'<td style="color:'+SRC_BY_K[ls.k].c+';font-weight:600;font-size:12px">'+SRC_BY_K[ls.k].n+'</td></tr>';}).join('')
  +'</tbody></table></div>'
  +'<div class="callout" style="margin-top:16px">'+icon('info')+' <b>Notice how the order changes.</b> The worst readings are often at industrial sites where hardly anyone lives. The greatest harm is usually in busy residential areas with moderate readings but many people.</div>'
  +(rec.length?'<div class="section-head"><h2>Schools and hospitals '+asmTag('Estimated')+'</h2></div>'
  +'<div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>Place</th><th>Type</th><th>'+p.label+'</th><th>Level</th>'+(has?'<th>If the test were real</th><th>Change</th>':'')+'</tr></thead><tbody>'
  +rec.map(function(x){const d=x.v2-x.v;
   return '<tr><td><b>'+x.r.name+'</b></td>'
    +'<td><span class="pill" style="font-size:10.5px">'+icon(x.r.type==='hospital'?'shield':'school')+x.r.type+'</span></td>'
    +'<td style="font-weight:700;font-variant-numeric:tabular-nums">'+Math.round(x.v)+'</td>'
    +'<td><span class="pill '+x.b.cls+'" style="font-size:10.5px">'+x.b.name+'</span></td>'
    +(has?'<td style="font-variant-numeric:tabular-nums;font-weight:700;color:'+bandFor(state.pollutant,x.v2).hex+'">'+Math.round(x.v2)+'</td>'

  +how([
   ['Harm means level multiplied by people','A moderate reading where 90,000 people live matters more than a severe reading where 2,000 do.'],
   ['Schools and hospitals are estimated at the building','Nobody measures inside every school, so the value is worked out from nearby places.'],
   ['The average counts people too','A city average treating empty desert the same as a packed district would understate what people actually breathe.']])
  +assumptions(baseAssumptions().concat([
   ['Every population figure is invented',
    'A realistic round number per area \u2014 Doha Industrial Area 124,000, Abu Samra 2,000. Not census data.','50 figures'],
   ['People are assumed to be where they live',
    'In Qatar a large share of the workforce spends the day at industrial sites and outdoors, so real exposure is likely higher than shown.','residence-based'],
   ['Indoor air is ignored',
    'Everyone in an area is assumed to breathe the outdoor level. Most people spend the day in air-conditioned buildings, which the model does not account for.','outdoor only']]),
   'Official census data plus a daytime population layer showing where people actually are during working hours.')
  +sources(['aq','carto','leaf','samp','cad'],
   'Population, schools and hospitals all come from the sample dataset. No Qatari census, facility register or cadastral data is used.');}
/* ===================== NEXT 3 DAYS ===================== */
function vForecast(){
 const p=POLLUTANTS[state.pollutant],ser=series(null);
 const isLive=liveActive()&&state.live&&state.live.series;
 if(!ser.length)return head("What happens over the next 3 days","No forecast available right now.")
  +modeBanner()+'<div class="card pad"><p class="muted">Switch to Sample data or Blended at the top of the page.</p></div>';
 const fut=ser.filter(s=>s.forecast);
 const now=ser.find(s=>s.k===0)||ser[ser.length-1];
 const t=srcTotals(null),dustShare=t?(t.dust/t._total):0.45;
 const lead=t?leadSource(t):null;
 const picks=[6,12,24,48,72].map(function(h){
  const s=fut.find(x=>x.k===h)||fut[fut.length-1];if(!s)return null;
  return{h,s,u:uncertainty(s.val,h,dustShare,isLive),b:bandFor(state.pollutant,s.val)};}).filter(Boolean);
 const maxV=picks.length?Math.max.apply(null,picks.map(x=>x.u.hi))*1.1:1;
 const pk=fut.length?fut.reduce((x,y)=>y.val>x.val?y:x,fut[0]):null;
 const tomorrow=picks.find(x=>x.h===24)||picks[0];
 const nowV=now?now.val:0;
 const dir=tomorrow?(tomorrow.s.val-nowV):0;
 const dirPct=nowV?Math.abs(dir/nowV*100):0;
 const dirWord=Math.abs(dirPct)<8?'stay about the same':(dir>0?'get worse':'improve');
 const peakBand=pk?bandFor(state.pollutant,pk.val):null;
 return head("What happens over the next 3 days",
  "A forecast is never one exact number. Here you get the best estimate, a range around it, and how confident to be.")
  +modeBanner()
  +(tomorrow?'<div class="bigread" style="margin-bottom:18px">'
   +'<div class="brl">In plain terms</div>'
   +'<div class="brv">Over the next 24 hours, '+p.label+' in '+esc(cityLabel())+' is expected to <b>'+dirWord+'</b>'
   +(Math.abs(dirPct)>=8?(' \u2014 by roughly '+Math.round(dirPct)+'%'):'')+'.</div>'
   +'<div class="brm">Best estimate for this time tomorrow: <b>'+tomorrow.s.val.toFixed(0)+' '+p.unit+'</b> '
   +'('+tomorrow.b.name.toLowerCase()+'). It could reasonably land anywhere between <b>'
   +tomorrow.u.lo.toFixed(0)+'</b> and <b>'+tomorrow.u.hi.toFixed(0)+'</b>. '
   +uncChip(tomorrow.u)+'</div></div>':'')
  +'<div class="fcx" style="margin-bottom:18px">'
  +'<div class="fcbox"><div class="fq">Why a range and not one number?</div>'
  +'<div class="fa">Because weather is not certain. The further ahead you look, the wider the range. '
  +'A 6-hour forecast is tight enough to act on today. A 3-day forecast tells you which way things are heading.</div></div>'
  +'<div class="fcbox"><div class="fq">What makes it less certain here?</div>'
  +'<div class="fa">Desert dust. It depends on weather systems forming hundreds of kilometres away. '
  +'Dust is assumed to be about <b>'+Math.round(dustShare*100)+'%</b> of the air, so the range is widened accordingly.</div></div>'
  +'<div class="fcbox"><div class="fq">What would you do with this?</div>'
  +'<div class="fa">'+(peakBand&&peakBand.idx>=3
   ? 'Levels are forecast to reach <b>'+peakBand.name.toLowerCase()+'</b>. That is the point at which you would consider advising schools to keep children indoors, rescheduling outdoor work, and giving hospitals notice.'
   : 'Levels stay below the point where advisories would normally be issued. No action needed, but keep watching.')+'</div></div></div>'
  +'<div class="card pad" style="margin-bottom:18px"><h3 style="font-size:16px;margin-bottom:3px">The next 3 days, hour by hour</h3>'
  +'<div class="muted" style="font-size:12px;margin-bottom:10px">Solid line is what already happened. Dashed line is the forecast. '
  +'The shaded band is the assumed range \u2014 notice how it fans out the further ahead you look.</div>'
  +chart(ser,0)+'</div>'
  +'<div class="section-head" style="margin-top:0"><h2>Looking further ahead</h2>'
  +'<div class="d">The same forecast at five points in time</div></div>'
  +'<div class="card" style="overflow:hidden"><table class="tbl"><thead><tr>'
  +'<th>How far ahead</th><th>When</th><th>Best estimate</th><th>Could be between '+asmTag()+'</th><th>Level</th><th>How sure</th></tr></thead><tbody>'
  +picks.map(function(x){
   return '<tr><td><b>'+(x.h<24?(x.h+' hours'):(x.h/24)+' day'+(x.h>24?'s':''))+'</b></td>'
    +'<td class="muted" style="font-size:12px">'+fmtDT(x.s.d)+'</td>'
    +'<td style="font-weight:700;font-size:15px;color:'+x.b.hex+';font-variant-numeric:tabular-nums">'+x.s.val.toFixed(0)+' '+p.unit+'</td>'
    +'<td style="width:210px"><div style="font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:3px">'+x.u.lo.toFixed(0)+' to '+x.u.hi.toFixed(0)+'</div>'+uncBar(x.s.val,x.u,maxV)+'</td>'
    +'<td><span class="pill '+x.b.cls+'" style="font-size:10.5px">'+x.b.name+'</span></td>'
    +'<td>'+uncChip(x.u)+'</td></tr>';}).join('')
  +'</tbody></table></div>'
  +'<div class="callout info" style="margin-top:16px">'+icon('info')
  +' <b>Read the middle column, not just the number.</b> A forecast of 90 that could be anywhere from 70 to 110 is a different decision from one landing between 85 and 95.</div>'
  +how([
   ['Where the forecast comes from',isLive
     ? 'The Copernicus Atmosphere Monitoring Service, which models the whole region including dust blowing in from outside Qatar. It updates four times a day.'
     : 'The live feed is not connected, so this shows an assumed typical pattern. Switch to Blended for the real forecast.'],
   ['Why there is a range','No forecast is exact. The range starts at about 10% either side and widens with three things: how far ahead, how much of the air is dust, and whether the live feed is connected.'],
   ['Why dust widens it most','Traffic follows a predictable daily rhythm. Dust depends on weather systems forming far outside Qatar.'],
   ['What "how sure" means','Fairly confident means a narrow range. Less confident means wide, and the number should be treated as a direction.'],
   ['What it is for','Lead time. Knowing at 6pm that tomorrow afternoon will be bad is enough to warn schools and move outdoor work.']])
  +assumptions(baseAssumptions().concat([
   ['The confidence range is an invented rule',
    'Starts at 10% either side, widens by about 0.45% per hour ahead, plus a fifth of the dust share, plus 7% if the live feed is missing. None of these numbers comes from checking past forecasts.','0.10 + 0.0045/h + 0.20d'],
   ['The range is assumed symmetric',
    'Equal above and below the estimate. Real air quality forecasts tend to under-predict bad days more often than good ones, so the true range is probably skewed.','equal both sides'],
   ['Dust is assumed the least predictable part',
    'Reasonable, but the amount of extra widening is invented rather than derived from forecast records.','x0.20 of dust share']]),
   'Checking past forecasts against what actually happened. That replaces the invented range with a measured one, and lets you quote real accuracy figures.')
  +sources(['aq','wx','carto','leaf','samp'],
   'The forecast is real published data from Copernicus. The shaded range around it is an assumption.');}

function vDust(){
 const w=state.weather;
 const active=state.dustActive||state.scenario.dustEvent>0;
 const sev=state.scenario.dustEvent||(state.dustActive?45:0);
 const base=avgFor('pm10',null);
 const scenD=Object.assign(blankScen(),{dustEvent:sev});
 const peak=avgFor('pm10',sev>0?scenD:null);
 const kp=state.pollutant;state.pollutant='pm10';
 const nodes10=nodeValues(sev>0?scenD:null);
 const e=exposed(nodes10,'pm10',3);
 state.pollutant=kp;
 const c=CITY_BY_K[state.cityKey];
 const rad=(w.windDir)*Math.PI/180,ux=Math.sin(rad),uy=Math.cos(rad);
 const proj=activeStations().map(function(s){
  const px=(s.lon-c.lon)*100,py=(s.lat-c.lat)*111;
  return{s,d:-(px*ux+py*uy)};}).sort((a,b)=>a.d-b.d);
 const spread=proj.length?proj[proj.length-1].d-proj[0].d:0;
 const travelH=w.windSpeed>0?(spread/w.windSpeed):0;
 const seq=proj.map(function(x){return{s:x.s,eta:w.windSpeed>0?((x.d-proj[0].d)/w.windSpeed):0};});
 const u=uncertainty(peak,12,0.75,liveActive());
 return head("Dust storms",

  +'<div class="btnrow"><button class="btn" data-act="dustpreset" data-v="40">Hazy day</button>'
  +'<button class="btn" data-act="dustpreset" data-v="75">Dust storm</button>'
  +'<button class="btn" data-act="dustpreset" data-v="0">Clear</button></div></div>'
  +'<div class="kpis" style="margin-bottom:18px">'
  +kpi("Normal day",base.toFixed(0)+' \u00b5g/m\u00b3','dust levels',bandFor('pm10',base).hex)
  +kpi("During the event",peak.toFixed(0)+' \u00b5g/m\u00b3',bandFor('pm10',peak).name+' (assumed)',bandFor('pm10',peak).hex)
  +kpi("Could be between",u.lo.toFixed(0)+'\u2013'+u.hi.toFixed(0),u.label,"var(--blue)")
  +(e?kpi("People affected",e.pct+'%',e.exposed.toLocaleString()+' (assumed)',"var(--red)"):kpi("People affected",'\u2014','\u2014',"var(--ink-3)"))+'</div>'
  +'<div class="maplayout"><div><div class="card" style="padding:14px">'+mapBlock('main',true)+mapLegend()+'</div></div>'

  +'<div class="section-head"><h2>What to do with the warning</h2></div><div class="card pad">'
  +insList([
   ins('school','Schools and outdoor workers','At '+peak.toFixed(0)+' \u00b5g/m\u00b3 the question is whether to cancel outdoor sport and move construction and port work. Qatar already has a summer working-hours system \u2014 the same mechanism could be triggered for dust.','#FBF3D6','#8a6d10'),
   ins('shield','Hospitals','More people turn up with breathing problems during and just after a big dust event. A few hours of notice lets hospitals get ready.','#FCE9E9','var(--red)'),

/* ===================== COMPARE OPTIONS ===================== */
function packageResult(key){
 const q=PRESETS[key];
 const sc=Object.assign(blankScen(),{traffic:q.traffic,fleet:q.fleet,industry:q.industry,
  constr:q.constr,power:q.power,marine:q.marine,greening:q.greening});
 const bN=nodeValues(null),sN=nodeValues(sc);
 const bA=popAvg(bN),sA=popAvg(sN);
 const eB=exposed(bN,state.pollutant,3),eS=exposed(sN,state.pollutant,3);
 const no2b=avgFor('no2',null),no2s=avgFor('no2',sc);
 const pm10b=avgFor('pm10',null),pm10s=avgFor('pm10',sc);
 const cost=scenCost(sc)*4;
 const fewer=(eB&&eS)?(eB.exposed-eS.exposed):0;
 const drop=bA-sA;
 return{key,q,sc,base:bA,after:sA,drop,pct:bA?(drop/bA*100):0,
  no2Pct:no2b?((no2s-no2b)/no2b*100):0,
  pm10Pct:pm10b?((pm10s-pm10b)/pm10b*100):0,
  eB,eS,fewer,cost,
  costPerPerson:fewer>0?(cost*1000000/fewer):0,
  costPerUnit:drop>0?(cost/drop):0};}
function cmpRow(label,vals,cols){
 return '<tr><td><b>'+label+'</b></td>'+vals.map(function(v,i){
  return '<td style="text-align:center;font-weight:700;font-variant-numeric:tabular-nums'
   +(cols&&cols[i]?';color:'+cols[i]:'')+'">'+v+'</td>';}).join('')+'</tr>';}
function vCompare(){
 const p=POLLUTANTS[state.pollutant];
 const rows=['low','med','high'].map(packageResult);
 const maxCost=Math.max.apply(null,rows.map(r=>r.cost))||1;
 const best=rows.slice().filter(r=>r.costPerUnit>0).sort((a,b)=>a.costPerUnit-b.costPerUnit)[0];
 const most=rows.slice().sort((a,b)=>b.fewer-a.fewer)[0];
 return head("Compare the options side by side",
  "Decisions get made between choices, not one at a time. All three packages, same measures, same page.")
  +modeBanner()
  +'<div class="callout warn" style="margin-bottom:18px">'+icon('alert')
  +' <b>Every figure here rests on assumptions.</b> The model assumes how much each measure reduces each source, and what each costs. '
  +'Use this to compare options against each other, not to predict exact outcomes.</div>'
  +'<div class="card" style="overflow:hidden;margin-bottom:18px"><table class="tbl"><thead><tr><th>Measure</th>'
  +rows.map(r=>'<th style="text-align:center">'+r.q.label
   +'<div class="muted" style="font-size:10px;font-weight:500;text-transform:none;letter-spacing:0">'+r.q.sub+'</div></th>').join('')
  +'</tr></thead><tbody>'
  +cmpRow(p.label+' after the change',rows.map(r=>r.after.toFixed(1)),rows.map(r=>bandFor(state.pollutant,r.after).hex))
  +cmpRow('Change in '+p.label,rows.map(r=>(r.pct>0?'+':'')+r.pct.toFixed(1)+'%'),rows.map(r=>r.drop>0?'var(--green)':'var(--red)'))
  +cmpRow('Traffic pollution change',rows.map(r=>(r.no2Pct>0?'+':'')+r.no2Pct.toFixed(1)+'%'),rows.map(()=>'var(--green)'))
  +cmpRow('Coarse dust change',rows.map(r=>(r.pm10Pct>0?'+':'')+r.pm10Pct.toFixed(1)+'%'),rows.map(()=>'var(--dust)'))
  +(rows[0].eB?cmpRow('People in affected areas',rows.map(r=>r.eS.pct+'%'),rows.map(r=>r.eS.pct<r.eB.pct?'var(--green)':'var(--ink-3)')):'')
  +(rows[0].eB?cmpRow('Fewer people affected',rows.map(r=>r.fewer.toLocaleString()),null):'')
  +cmpRow('Rough cost a year',rows.map(r=>'QAR '+r.cost.toFixed(0)+'m'),null)
  +cmpRow('Cost per person protected',rows.map(r=>r.costPerPerson>0?('QAR '+Math.round(r.costPerPerson).toLocaleString()):'\u2014'),
    rows.map(r=>r===best?'var(--maroon)':'var(--ink)'))
  +'<tr><td></td>'+rows.map(r=>'<td style="text-align:center"><button class="btn sm'+(state.preset===r.key?' primary':'')
    +'" data-act="preset" data-k="'+r.key+'">'+(state.preset===r.key?'Selected':'Try this one')+'</button></td>').join('')+'</tr>'
  +'</tbody></table></div>'
  +'<div class="section-head"><h2>Cost against benefit</h2><div class="d">Bar width is the rough yearly cost</div></div>'
  +'<div class="card pad" style="margin-bottom:18px">'
  +rows.map(function(r){
   return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">'
    +'<b>'+r.q.label+'</b><span class="muted">QAR '+r.cost.toFixed(0)+'m a year \u00b7 '+p.label+' down '+Math.abs(r.pct).toFixed(1)+'%'
    +(r.fewer>0?(' \u00b7 '+r.fewer.toLocaleString()+' fewer people affected'):'')+'</span></div>'
    +'<div style="height:16px;background:#F0E9E4;border-radius:8px;overflow:hidden"><div style="width:'
    +(r.cost/maxCost*100).toFixed(1)+'%;height:16px;background:linear-gradient(90deg,var(--maroon-d),var(--maroon));border-radius:8px"></div></div></div>';}).join('')

  +insList([
   best?ins('target','Best value for money',best.q.label+' gives the lowest cost for each unit of improvement, at about QAR '
    +Math.round(best.costPerPerson).toLocaleString()+' per person protected. Cheapest per unit is not automatically right \u2014 it may simply not do enough.','#FBEFF2','var(--maroon-d)'):null,
   most&&most.fewer>0?ins('users','Helps the most people',most.q.label+' protects the most people, about '+most.fewer.toLocaleString()
    +'. It also costs the most, so the question is whether the extra benefit justifies the extra spend.'):null,
   ins('dust','Watch the two pollution rows','Traffic pollution falls far more than coarse dust in every package. That gap is desert dust, which no policy here can touch. '
    +'Judge these plans on dust and they all look weak. Judge them on traffic pollution and they look strong.','#FDF3E6','var(--dust)'),
   ins('info','What this cannot tell you','Whether a package is politically or practically deliverable, how long it takes, or how the cost spreads across years. '
    +'This narrows the shortlist. It does not make the decision.')])+'</div>'
  +how([
   ['All three run through the same model','Each package is the same calculation with different slider settings, so the comparison is like for like.'],
   ['Cost per person protected','Yearly cost divided by how many fewer people end up in affected areas.'],
   ['Two pollution rows, deliberately','Traffic pollution and coarse dust respond very differently to the same measures.'],
   ['Click any column to load it','That package loads into the What If page, where you can adjust it.']])
  +assumptions(baseAssumptions().concat([
   ['The three packages are invented bundles',
    'Low, Medium and High are illustrative combinations of measures, not costed plans drawn up with any Qatari authority.','3 packages'],
   ['Each measure is assumed to work in direct proportion',
    'The same 1:1 response assumption used on the What If page.','1:1 response'],
   ['Costs are invented rates',
    'Per percentage point per year, converted at an assumed exchange rate. For comparing options only.','7 rates'],
   ['Cost per person protected inherits both',
    'It divides an assumed cost by an assumed population change, so it carries two layers of assumption.','compound']]),

  +sources(['aq','carto','leaf','samp'],

/* ===================== DATA & METHOD =====================
   Four parts:
   1. Method     - how a number gets from a satellite to the screen
   2. Sources    - every source, named exactly, in one table
   3. Assumptions- all of them, grouped
   4. Limits     - what this cannot do, and what would fix it          */

/* --- the five stages a number passes through --- */
const METHOD_FLOW=[
 ['Observe','A European satellite-and-model service estimates pollution across the whole region, updated four times a day. Qatar sits inside that grid.','Copernicus via Open-Meteo'],
 ['Place','The value is read at each of the 50 places in this demo. In a real system these would be actual monitoring stations.','Sample dataset \u00b7 assumption'],
 ['Spread','The map between places is filled in, weighting nearby places more than distant ones, then shifted downwind and thinned by wind speed.','Calculated here \u00b7 assumption'],
 ['Split','Each total is divided across six causes using an assumed mix for that location, then weighted by how strongly each cause emits that pollutant.','Sample dataset \u00b7 assumption'],
 ['Decide','Levels become bands, bands become alerts, alerts route to owners, and scenarios re-run the whole chain with sliders applied.','Calculated here \u00b7 assumption']];

/* --- the calculations, written out --- */
const METHOD_CALCS=[
 {h:'Filling the map between places',rows:[
  ['What it does','Estimates a level anywhere, not just at the 50 places.'],
  ['How','<span class="mformula">value = &Sigma;(reading &divide; distance<sup>2.5</sup>) &divide; &Sigma;(1 &divide; distance<sup>2.5</sup>)</span>'],
  ['Meaning','Nearby places count far more than distant ones. A place 1 km away carries roughly 32 times the weight of one 4 km away.'],
  ['Assumption','Pollution is assumed to change smoothly across ground. A busy road can differ sharply from the street behind it, and this does not capture that.',1]]},
 {h:'What wind does \u2014 two opposing effects',rows:[
  ['Effect one','Wind blows pollution away. Everything is divided by a dispersion factor.'],
  ['How','<span class="mformula">dispersion = 1 + (speed &minus; 14) &times; 0.022</span>, floored at 0.55'],
  ['Effect two','Above about 18 km/h, wind lifts loose sand off the ground. Only the dust part increases.'],
  ['How','<span class="mformula">dust lift = 1 + min(0.55, (speed &minus; 18) &divide; 30)</span>'],
  ['Net result','At 40 km/h, coarse dust sits at about 85% of its calm-day level while traffic pollution drops to 64%. The gases clear; the dust does not.'],
  ['Assumption','Both relationships are assumed. The thresholds, rates and ceilings are chosen to behave sensibly, not derived from Qatari measurements.',1]]},
 {h:'Splitting a total into causes',rows:[
  ['What it does','Turns one number into six \u2014 dust, traffic, industry, construction, power, shipping.'],
  ['How','<span class="mformula">share = base &times; mix &times; pollutant weight &times; hour profile</span>'],
  ['Then','In Blended mode all six are scaled so they add back to the real measured total.'],
  ['Assumption','The mix per place and the pollutant weights are both invented. This is the single largest assumption in the whole demonstration.',1]]},
 {h:'Weighting by population',rows:[
  ['What it does','Makes the city average reflect what people actually breathe.'],
  ['How','<span class="mformula">average = &Sigma;(value &times; people) &divide; &Sigma;(people)</span>'],
  ['Why','A moderate reading where 90,000 live matters more than a severe one where 2,000 do.'],
  ['Assumption','Population figures are invented, and count where people sleep rather than where they spend the working day.',1]]},
 {h:'The confidence range on forecasts',rows:[
  ['What it does','Turns a single forecast number into a range.'],
  ['How','<span class="mformula">spread = 0.10 + (hours &times; 0.0045) + (dust share &times; 0.20) + 0.07 if no live feed</span>'],
  ['Meaning','Starts around 10% either side, widens with how far ahead you look and how much of the air is dust.'],
  ['Assumption','Entirely invented. A real range would come from running the forecast many times with slightly different starting conditions, and from checking past forecasts against outcomes.',1]]}];

  ['No knock-on effects','No traffic displacement, no economic consequences, no behaviour change.','isolated']]],

  ['Colour bands are set for the Gulf','Widened from European values because desert dust is always present.','PM10 50/100/150/250/400'],
  ['National limit figures are placeholders','Qatar\u2019s published standards must replace them before any planning use.','PM2.5 35 \u00b7 PM10 150'],
  ['Alert thresholds are chosen','High band, one band earlier at schools and hospitals.','band 3 / band 2'],

/* ===================== EVENTS ===================== */
function toast(m,t){const el=document.getElementById('toast');document.getElementById('toast-msg').textContent=m;
 el.querySelector('.dot').style.background=t==='warn'?'var(--dust)':'var(--green)';
 el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400);}
function dl(fn,c){const b=new Blob([c],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);}
async function boot(){
 const city=JSON.parse(JSON.stringify(QATAR));
 state.city=city;state.selected=null;state.preset=null;state.scenario=blankScen();
 state.screen="loading";render();
 const ok=await loadLive(city);
 state.hour=new Date().getHours();state.screen="home";render();
 toast(ok?"Live data connected":"Live feed unavailable \u2014 using assumptions",ok?"ok":"warn");
 if(!ok&&state.mode!=='sample'){state.mode='sample';render();}
 auto();}
let _a=null;
function auto(){if(_a)clearInterval(_a);
 _a=setInterval(function(){if(!state.city||state.screen==='loading'||!usesLive())return;
  loadLive(state.city).then(function(ok){if(!ok)return;
   if(['home','live','attrib','hotspot','exposure','forecast','dust','alerts','kpi','brief'].indexOf(state.screen)>=0)render();
   else redrawAll();});},300000);}
let _p=null;
function play(){
 state.tPlaying=!state.tPlaying;
 if(_p){clearInterval(_p);_p=null;}
 if(state.tPlaying)_p=setInterval(function(){
  state.tOffset+=1;if(state.tOffset>72)state.tOffset=-48;
  const s=document.querySelector('[data-act="scrub"]');if(s)s.value=state.tOffset;
  render();},900);
 render();}
let _w=false;
function wire(){if(_w)return;_w=true;
 document.addEventListener('click',onClick);
 document.addEventListener('input',onInput,true);
 document.addEventListener('change',onChange,true);}
function switchCity(k){
 if(!CITY_BY_K[k]||k===state.cityKey)return;
 state.cityKey=k;state.selected=null;
 if(usesLive()){loadLive(state.city).then(function(){render();refitMaps();});}
 render();refitMaps();toast(cityLabel());}
function switchMode(k){
 if(!MODE_BY_K[k]||k===state.mode)return;
 state.mode=k;state.selected=null;
 if(usesLive()&&!state.liveOK){loadLive(state.city).then(function(){render();redrawAll();});}
 render();redrawAll();toast(MODE_BY_K[k].n);}
function onClick(e){
 const t=e.target.closest('[data-act]');if(!t)return;
 switch(t.dataset.act){
  case"nav": if(state.tPlaying&&t.dataset.s!=='time'){state.tPlaying=false;if(_p){clearInterval(_p);_p=null;}}
   state.screen=t.dataset.s;window.scrollTo(0,0);render();break;
  case"pol": state.pollutant=t.dataset.p;render();break;
  case"city": switchCity(t.dataset.v);break;
  case"mode": switchMode(t.dataset.m);break;
  case"refresh": state.screen="loading";render();
   loadLive(state.city).then(ok=>{state.hour=new Date().getHours();state.screen="home";render();
    toast(ok?"Refreshed":"Live feed unavailable",ok?"ok":"warn");});break;
  case"tog": state[t.dataset.t]=!state[t.dataset.t];render();break;
  case"pick": {const id=t.dataset.s;
   state.selected=state.selected===id?null:id;
   if(state.screen==='home')state.screen='hotspot';
   render();break;}
  case"lvl": state.level=+t.dataset.n;render();refitMaps();break;
  case"preset": {const k=t.dataset.k,q=PRESETS[k];
   state.scenario=Object.assign(blankScen(),{traffic:q.traffic,fleet:q.fleet,industry:q.industry,
    constr:q.constr,power:q.power,marine:q.marine,greening:q.greening});
   state.preset=k;render();toast(q.label+" package loaded");break;}
  case"ask": {const q=QUESTIONS.find(x=>x.id===t.dataset.q);if(!q)break;
   state.scenario=Object.assign(blankScen(),q.set);
   state.preset=q.id;render();toast("Loaded");break;}
  case"dustpreset": state.scenario.dustEvent=+t.dataset.v;
   if(+t.dataset.v===0)state.dustActive=false;
   render();toast(+t.dataset.v?("Dust storm at "+t.dataset.v+"%"):"Cleared");break;
  case"run": render();toast("Updated");break;
  case"reset": state.scenario=blankScen();state.preset=null;render();toast("Reset");break;
  case"play": play();break;
  case"tnow": state.tOffset=0;if(state.tPlaying)play();else render();break;
  case"print": window.print();break;
  case"export": exportCfg();break;}}
function onChange(e){const t=e.target.closest('[data-act]');if(!t)return;
 if(t.dataset.act==='base'){state.basemap=t.value;Object.keys(MAPS).forEach(k=>setBase(MAPS[k],state.basemap));render();}
 if(t.dataset.act==='city'){switchCity(t.value);}}
function onInput(e){
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.dataset.act==='haze'){state.surfaceOpacity=(+t.value)/100;
  const l=document.getElementById('hz');if(l)l.textContent=t.value+'%';
  Object.keys(MAPS).forEach(k=>{const o=MAPS[k];if(o.surface&&o.surface.draw)o.surface.draw();});return;}
 if(t.dataset.act==='scrub'){state.tOffset=+t.value;
  if(state.tPlaying)play();else sched();return;}
 if(t.dataset.act==='scen'){
  state.scenario[t.dataset.key]=+t.value;
  if(t.dataset.key!=='dustEvent')state.preset=null;
  const l=t.closest('.slider-field').querySelector('.sl-val');
  if(l)l.textContent=t.value+' %';
  sched();return;}}
let _rt=null;function sched(){clearTimeout(_rt);_rt=setTimeout(()=>render(),170);}
function exportCfg(){
 const n=nodeValues(null),e=exposed(n,state.pollutant,3),t=srcTotals(null);
 const cfg={country:"Qatar",city:cityLabel(),dataSetting:MODE_BY_K[state.mode].n,
  liveConnected:state.liveOK,pollutant:state.pollutant,
  weather:state.weather,test:usesStructure()?state.scenario:null,
  average:+popAvg(n).toFixed(2),averageBasis:avgLabel(),
  assumedMakeUp:t?SOURCES.reduce((a,s)=>{a[s.k]=+((t[s.k]/t._total)*100).toFixed(1);return a;},{}):null,
  peopleAffectedAssumed:e,
  places:n.filter(x=>!x.noData).map(x=>({name:x.st.name,lat:x.st.lat,lon:x.st.lon,
   value:+x.value.toFixed(1),basis:x.prov})),
  dataSources:{
   airQuality:SRC_REG.aq.n+' \u2014 '+SRC_REG.aq.under,
   weather:SRC_REG.wx.n,
   baseMap:SRC_REG.carto.n+' / '+SRC_REG.osm.n,
   satellite:SRC_REG.esri.n,
   healthGuidelines:SRC_REG.who.n,
   sampleDataset:SRC_REG.samp.n,
   cadastral:'NOT USED \u2014 no land parcel or ownership data anywhere in this demonstration'},
  exportedAt:new Date().toISOString(),
  note:"Sample demonstration. Air quality readings, weather and forecasts are real. Monitoring places, source mixes, population figures, costs and national limits are assumptions made for this demonstration. Not for official, regulatory or compliance use."};
 dl("qatar_air_demo.json",JSON.stringify(cfg,null,2));toast("Downloaded");}
loadMapLib(0,function(){boot();});

</script>
